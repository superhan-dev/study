width 1280
height 720
camera_name Camera1
auto_brightness off
framerate 15
rotate 0
mask_privacy 
target_dir /var/lib/motioneye/Camera1
stream_localhost off
stream_port 9081
stream_maxrate 15
stream_quality 75
stream_motion off
stream_auth_method 0
